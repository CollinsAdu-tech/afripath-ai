<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfriPath AI — Your matches</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <span class="pill reveal">Your AfriPath AI results</span>
      <h1 class="display h-xl reveal" style="--d:.08s">Paths that may <span class="accent">fit</span> you</h1>
      <p class="lead reveal" style="--d:.16s">Built only from the answers you gave. Use them as starting points to explore, not a verdict.</p>
      <div class="crumbs reveal" style="--d:.22s"><a class="btn" href="afripath-ai.html">← Change my answers</a></div>
    </div>
  </section>
  <section class="wrap" style="padding-bottom:clamp(60px,8vw,130px)"><div id="results" aria-live="polite"><div class="status-block"><div class="spinner" role="status" aria-label="Working out your matches"></div></div></div></section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/results.js"></script>
</body>
</html>
