<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfriPath AI — Login</title>
  <meta name="description" content="Accounts are not open yet. AfriPath AI works without one.">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

  <section class="page-hero"><div class="wrap">
    <span class="pill reveal">Accounts</span>
    <h1 class="display h-xl reveal" style="--d:.08s"><span class="accent">Login</span> is on the way</h1>
    <p class="lead reveal" style="--d:.16s">Accounts will let you save your matches and progress across devices. They are not open yet, and you do not need one to use AfriPath AI.</p>
  </div></section>
  <section class="wrap" style="padding-bottom:clamp(60px,8vw,130px)">
    <div class="panel login-card reveal">
      <form onsubmit="return false" aria-describedby="login-note">
        <div class="form-field"><label for="em">Email</label><input id="em" type="email" placeholder="you@example.com" disabled></div>
        <div class="form-field"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••" disabled></div>
        <button class="btn btn--ink" type="button" disabled>Login (not open yet)</button>
      </form>
      <p class="small" id="login-note" style="margin-top:16px">AfriPath AI is not asking for any account details yet.</p>
      <a class="btn btn--primary" href="afripath-ai.html">Continue without an account <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/page.js"></script>
</body>
</html>
