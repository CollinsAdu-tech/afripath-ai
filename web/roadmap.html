<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfriPath AI — Your roadmap</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <span class="pill reveal" id="rm-cat">Roadmap</span>
      <h1 class="display h-xl reveal" id="rm-title" style="--d:.08s">Your <span class="accent">roadmap</span></h1>
      <p class="lead reveal" id="rm-sum" style="--d:.16s"></p>
      <div class="crumbs reveal" style="--d:.22s"><a class="btn" href="results.html">← Back to my matches</a></div>
    </div>
  </section>
  <section class="wrap" style="padding-bottom:clamp(60px,8vw,130px)"><div id="roadmap" class="rm-sections" aria-live="polite"><div class="status-block"><div class="spinner" role="status" aria-label="Building your roadmap"></div></div></div></section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/roadmap.js"></script>
</body>
</html>
